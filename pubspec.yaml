name: poke
description: 「手欠」— 本地待办事项 App：摇一摇抽任务、系统日历提醒、局域网 Web 控制台。没事就手欠，手欠就有事。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 本地存储
  sqflite: ^2.4.5
  path: ^1.9.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

  # 日期 / 标识 / 加密
  intl: any
  uuid: ^4.6.0
  crypto: ^3.0.7
  timezone: ^0.9.0

  # 系统日历提醒
  device_calendar: ^4.3.3

  # 摇一摇
  sensors_plus: ^7.1.1
  wakelock_plus: ^1.8.0
  flutter_foreground_task: ^11.0.3

  # 本地通知（摇一摇抽中任务弹出提醒）
  flutter_local_notifications: 18.0.1

  # 提示音播放（摇一摇抽中反馈）
  audioplayers: ^6.1.0

  # 振动（系统 HapticFeedback 在静音模式下无感，这里用 Vibrator 保证振动）
  vibration: ^3.2.1

  # 局域网 Web 控制台
  shelf: ^1.4.3
  shelf_router: ^1.1.5
  excel: ^4.0.6
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/sound/

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手欠 · 待办控制台</title>
<style>
  :root {
    --accent: #2BB57A;
    --accent-bright: #3DDC97;
    --accent-soft: #EAFBF3;
    --danger: #FF5A5F;
    --bg: #F5FBF8;
    --card: #ffffff;
    --text: #1F2D28;
    --muted: #9AA8A3;
    --line: #EDF3F0;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 20px 64px; }

  /* 登录 */
  .login-wrap { display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; }
  .login-card {
    background: var(--card); border-radius: 24px; padding: 40px 36px; width: 100%; max-width: 380px;
    box-shadow: 0 16px 48px rgba(31, 45, 40, .10); text-align: center;
  }
  .logo { font-size: 40px; }
  .login-card h1 { font-size: 21px; margin: 8px 0 4px; }
  .login-card p { color: var(--muted); margin: 0 0 22px; font-size: 13px; }

  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px;
    font: inherit; color: var(--text); background: #fff; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; justify-content: center;
    padding: 9px 16px; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--text); font: inherit; cursor: pointer; transition: .15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent-bright); border-color: var(--accent-bright); color: #fff; }
  .btn-primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { border-color: var(--danger); color: var(--danger); }
  .btn-block { width: 100%; }
  .btn-sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }

  /* 顶栏 */
  .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .topbar h1 { font-size: 20px; margin: 0; margin-right: auto; display: flex; align-items: center; gap: 8px; }
  .search { width: 200px; border-radius: 999px; }
  .btn { border-radius: 12px; }
  .btn-primary, .btn-block { border-radius: 999px; }

  /* 过滤 */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip {
    padding: 5px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; font-size: 13px; color: var(--muted);
  }
  .chip.active { background: var(--accent-bright); border-color: var(--accent-bright); color: #fff; }

  /* 列表 */
  .list-card { background: var(--card); border-radius: 20px; box-shadow: 0 2px 8px rgba(46, 58, 54, 0.06); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; background: #fafbfe; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafbff; }
  .title-cell { font-weight: 500; }
  .desc { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; white-space: nowrap;
  }
  .badge.pending { background: var(--accent-soft); color: var(--accent); }
  .badge.inProgress { background: #FFF6E5; color: #D97706; }
  .badge.completed { background: #EAFBF3; color: var(--accent); }
  .badge.archived { background: #EDF3F0; color: var(--muted); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .p1 { background: #DCE5E1; } .p2 { background: #7FE8C0; } .p3 { background: #2BB57A; }
  .overdue { color: var(--danger); }
  .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .empty { padding: 56px 20px; text-align: center; color: var(--muted); }
  .empty .big { font-size: 42px; }

  .footer { margin-top: 14px; color: var(--muted); font-size: 12.5px; text-align: center; }

  /* 弹窗 */
  dialog {
    border: none; border-radius: 24px; padding: 26px; width: 100%; max-width: 480px;
    box-shadow: 0 16px 40px rgba(31, 45, 40, 0.14);
  }
  dialog::backdrop { background: rgba(31, 45, 40, 0.32); }
  dialog h2 { margin: 0 0 18px; font-size: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .row-2 { display: flex; gap: 12px; }
  .row-2 > * { flex: 1; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .day-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .day-chip { padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; font-size: 13px; }
  .day-chip.on { background: var(--accent-bright); border-color: var(--accent-bright); color: #fff; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* 提示 */
  #toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px);
    background: #22293c; color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: .25s; z-index: 99;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .preview-box { max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
  .preview-box table th, .preview-box table td { padding: 8px 10px; font-size: 12.5px; }
  .error-text { color: var(--danger); font-size: 13px; min-height: 20px; margin: 10px 0 0; }
</style>
</head>
<body>

<!-- 登录 -->
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="logo">🫧</div>
    <h1>手欠 · 待办控制台</h1>
    <p>没事就手欠，手欠就有事<br><span style="opacity:.7">Can't help poking? Then get things done.</span></p>
    <input id="pwdInput" type="password" placeholder="访问密码" autocomplete="current-password">
    <div class="error-text" id="loginError"></div>
    <button class="btn btn-primary btn-block" id="loginBtn">登录</button>
  </div>
</div>

<!-- 主界面 -->
<div id="mainView" class="wrap" hidden>
  <div class="topbar">
    <h1>🫧 手欠 · 待办控制台</h1>
    <input class="search" id="searchInput" placeholder="搜索标题 / 备注…">
    <button class="btn btn-primary" id="addBtn">＋ 新建</button>
    <button class="btn" id="importBtn">导入</button>
    <button class="btn" id="exportCsvBtn">导出 CSV</button>
    <button class="btn" id="exportJsonBtn">导出 JSON</button>
    <button class="btn" id="refreshBtn">刷新</button>
  </div>

  <div class="chips" id="filterChips">
    <div class="chip active" data-filter="all">全部</div>
    <div class="chip" data-filter="pending">待执行</div>
    <div class="chip" data-filter="inProgress">执行中</div>
    <div class="chip" data-filter="completed">已完成</div>
    <div class="chip" data-filter="archived">已归档</div>
  </div>

  <div class="list-card">
    <table>
      <thead>
        <tr>
          <th>事项</th><th style="width:150px">截止</th><th style="width:96px">重复</th>
          <th style="width:90px">优先级</th><th style="width:90px">状态</th><th style="width:190px"></th>
        </tr>
      </thead>
      <tbody id="todoBody"></tbody>
    </table>
    <div class="empty" id="emptyView" hidden>
      <div class="big">🫧</div>
      <div>还没有待办，手欠一下就有事了</div>
    </div>
  </div>

  <div class="footer" id="footerText"></div>
</div>

<!-- 新建 / 编辑 -->
<dialog id="editDialog">
  <h2 id="editTitle">新建待办</h2>
  <div class="field">
    <label>标题 *</label>
    <input id="fTitle" placeholder="要做什么？">
  </div>
  <div class="field">
    <label>备注</label>
    <textarea id="fDesc" rows="2" placeholder="可选"></textarea>
  </div>
  <div class="row-2">
    <div class="field">
      <label>截止时间</label>
      <input id="fDue" type="datetime-local">
    </div>
    <div class="field">
      <label>优先级</label>
      <select id="fPriority">
        <option value="1">低</option>
        <option value="2" selected>中</option>
        <option value="3">高</option>
      </select>
    </div>
  </div>
  <div class="row-2">
    <div class="field">
      <label>重复</label>
      <select id="fRepeat">
        <option value="none">不重复</option>
        <option value="daily">每天</option>
        <option value="workday">工作日</option>
        <option value="weekly">每周</option>
        <option value="monthly">每月</option>
        <option value="yearly">每年</option>
        <option value="customInterval">每隔 N 天</option>
      </select>
    </div>
    <div class="field" id="intervalField" hidden>
      <label>间隔天数</label>
      <input id="fInterval" type="number" min="1" value="1">
    </div>
    <div class="field" id="statusField">
      <label>状态</label>
      <select id="fStatus">
        <option value="pending">待执行</option>
        <option value="inProgress">执行中</option>
        <option value="completed">已完成</option>
        <option value="archived">已归档</option>
      </select>
    </div>
  </div>
  <div class="field" id="daysField" hidden>
    <label>每周的哪几天</label>
    <div class="day-chips" id="dayChips"></div>
    <div class="hint">不选则按每 7 天重复</div>
  </div>
  <div class="dialog-actions">
    <button class="btn" id="cancelEditBtn">取消</button>
    <button class="btn btn-primary" id="saveEditBtn">保存</button>
  </div>
</dialog>

<!-- 导入 -->
<dialog id="importDialog">
  <h2>批量导入</h2>
  <div class="field">
    <label>选择 CSV / XLSX / JSON 文件</label>
    <input id="fileInput" type="file" accept=".csv,.xlsx,.json">
    <div class="hint">列格式：title, description, due_date, repeat_type, repeat_days, interval_days, status, priority</div>
  </div>
  <div id="previewArea" hidden>
    <div class="field">
      <label>预览（前 20 行）</label>
      <div class="preview-box">
        <table>
          <thead><tr><th>标题</th><th>截止</th><th>重复</th><th>优先级</th></tr></thead>
          <tbody id="previewBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="error-text" id="importError"></div>
  <div class="dialog-actions">
    <button class="btn" id="cancelImportBtn">取消</button>
    <button class="btn btn-primary" id="confirmImportBtn" disabled>确认导入</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
/* ---------- SHA-256（纯 JS，供挑战-响应登录使用） ---------- */
function sha256(binaryString) {
  function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
  var mathPow = Math.pow, maxWord = mathPow(2, 32), i, j, result = '';
  var words = [], asciiBitLength = binaryString.length * 8;
  var hash = [], k = [];
  var primeCounter = k.length, isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  binaryString += '\x80';
  while (binaryString.length % 64 - 56) binaryString += '\x00';
  for (i = 0; i < binaryString.length; i++) {
    j = binaryString.charCodeAt(i);
    if (j >> 8) return; // 仅接受字节串
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = ((asciiBitLength / maxWord) | 0);
  words[words.length] = (asciiBitLength);
  for (j = 0; j < words.length;) {
    var w = words.slice(j, j += 16);
    var oldHash = hash;
    hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2];
      var a = hash[0], e = hash[4];
      var temp1 = hash[7]
        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e & hash[5]) ^ ((~e) & hash[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (
            w[i - 16]
            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
            + w[i - 7]
            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
          ) | 0
        );
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (i = 0; i < 8; i++) {
    for (j = 3; j + 1; j--) {
      var b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result;
}

function utf8Bytes(str) {
  var out = '';
  for (var i = 0; i < str.length; i++) {
    var cp = str.codePointAt(i);
    if (cp > 0xffff) i++;
    if (cp < 0x80) out += String.fromCharCode(cp);
    else if (cp < 0x800) out += String.fromCharCode(0xC0 | (cp >> 6), 0x80 | (cp & 63));
    else if (cp < 0x10000) out += String.fromCharCode(0xE0 | (cp >> 12), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
    else out += String.fromCharCode(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
  }
  return out;
}

/* 与 App 端一致：digest = sha256(sha256(password + salt) + nonce) */
function loginDigest(password, salt, nonce) {
  var verifier = sha256(utf8Bytes(password + salt));
  return sha256(utf8Bytes(verifier + nonce));
}

/* ---------- 工具 ---------- */
const $ = (id) => document.getElementById(id);

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { showLogin(); throw new Error(data.error || '请重新登录'); }
  if (!res.ok) throw new Error(data.error || ('请求失败 (' + res.status + ')'));
  return data;
}

const REPEAT_LABEL = {
  none: '不重复', daily: '每天', workday: '工作日', weekly: '每周',
  monthly: '每月', yearly: '每年', customInterval: '自定义',
};
const STATUS_LABEL = {
  pending: '待执行', inProgress: '执行中', completed: '已完成', archived: '已归档',
};
const PRIORITY_LABEL = { 1: '低', 2: '中', 3: '高' };

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  const pad = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
    ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function toLocalInputValue(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const pad = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
    'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

/* ---------- 登录 ---------- */
function showLogin() {
  $('loginView').hidden = false;
  $('mainView').hidden = true;
}

async function tryLogin() {
  const password = $('pwdInput').value;
  $('loginError').textContent = '';
  if (!password) { $('loginError').textContent = '请输入密码'; return; }
  try {
    const challenge = await api('/api/auth/challenge');
    const digest = loginDigest(password, challenge.salt, challenge.nonce);
    await api('/api/login', { method: 'POST', body: JSON.stringify({ digest }) });
    $('loginView').hidden = true;
    $('mainView').hidden = false;
    $('pwdInput').value = '';
    window.scrollTo(0, 0);
    await loadTodos();
    toast('登录成功');
  } catch (e) {
    $('loginError').textContent = e.message;
  }
}

/* ---------- 列表 ---------- */
const state = { todos: [], filter: 'all', q: '', editingId: null };

async function loadTodos() {
  const data = await api('/api/todos');
  state.todos = data.todos || [];
  render();
}

function render() {
  const q = state.q.trim().toLowerCase();
  const rows = state.todos.filter((t) => {
    if (state.filter !== 'all' && t.status !== state.filter) return false;
    if (q && !(t.title || '').toLowerCase().includes(q) &&
        !(t.description || '').toLowerCase().includes(q)) return false;
    return true;
  });

  const body = $('todoBody');
  body.innerHTML = '';
  $('emptyView').hidden = rows.length > 0;

  for (const t of rows) {
    const due = t.next_due_date || t.due_date;
    const overdue = t.status === 'pending' && due && new Date(due) < new Date();
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td><div class="title-cell"></div><div class="desc"></div></td>' +
      '<td class="' + (overdue ? 'overdue' : '') + '"></td>' +
      '<td></td>' +
      '<td><span class="dot p' + (t.priority || 2) + '"></span>' + (PRIORITY_LABEL[t.priority] || '中') + '</td>' +
      '<td><span class="badge ' + t.status + '">' + (STATUS_LABEL[t.status] || t.status) + '</span></td>' +
      '<td><div class="row-actions">' +
        '<button class="btn btn-sm btn-primary" data-act="done">完成</button>' +
        '<button class="btn btn-sm" data-act="edit">编辑</button>' +
        '<button class="btn btn-sm btn-danger" data-act="del">删除</button>' +
      '</div></td>';

    tr.querySelector('.title-cell').textContent = t.title;
    tr.querySelector('.desc').textContent = t.description || '';
    tr.children[1].textContent = fmtDate(due) + (overdue ? ' · 已逾期' : '');
    tr.children[2].textContent = REPEAT_LABEL[t.repeat_type] || '不重复';

    tr.querySelector('[data-act="done"]').onclick = () => completeTodo(t);
    tr.querySelector('[data-act="edit"]').onclick = () => openEdit(t);
    tr.querySelector('[data-act="del"]').onclick = () => removeTodo(t);
    body.appendChild(tr);
  }

  $('footerText').textContent =
    '共 ' + state.todos.length + ' 项 · 当前显示 ' + rows.length + ' 项 · 数据保存在手机本地';
}

async function completeTodo(t) {
  try {
    const data = await api('/api/todos/' + t.id + '/complete', { method: 'POST' });
    let msg = t.repeat_type && t.repeat_type !== 'none' ? '已完成，已排期到下次' : '已完成';
    if (data.calendar_warning) msg += '（日历未同步：' + data.calendar_warning + '）';
    toast(msg);
    await loadTodos();
  } catch (e) { toast(e.message); }
}

async function removeTodo(t) {
  if (!confirm('删除「' + t.title + '」？')) return;
  try {
    await api('/api/todos/' + t.id, { method: 'DELETE' });
    toast('已删除');
    await loadTodos();
  } catch (e) { toast(e.message); }
}

/* ---------- 新建 / 编辑 ---------- */
function openEdit(todo) {
  state.editingId = todo ? todo.id : null;
  $('editTitle').textContent = todo ? '编辑待办' : '新建待办';
  $('fTitle').value = todo ? todo.title : '';
  $('fDesc').value = todo ? (todo.description || '') : '';
  $('fDue').value = toLocalInputValue(todo ? (todo.next_due_date || todo.due_date) : '');
  $('fPriority').value = String(todo ? (todo.priority || 2) : 2);
  $('fRepeat').value = todo ? (todo.repeat_type || 'none') : 'none';
  $('fInterval').value = todo ? (todo.interval_days || 1) : 1;
  $('fStatus').value = todo ? todo.status : 'pending';
  $('statusField').hidden = !todo;
  renderDayChips(todo ? (todo.repeat_days || []) : []);
  syncRepeatUI();
  $('editDialog').showModal();
}

function renderDayChips(selected) {
  const names = ['', '一', '二', '三', '四', '五', '六', '日'];
  const box = $('dayChips');
  box.innerHTML = '';
  for (let d = 1; d <= 7; d++) {
    const chip = document.createElement('div');
    chip.className = 'day-chip' + (selected.includes(d) ? ' on' : '');
    chip.textContent = '周' + names[d];
    chip.dataset.day = d;
    chip.onclick = () => chip.classList.toggle('on');
    box.appendChild(chip);
  }
}

function syncRepeatUI() {
  const repeat = $('fRepeat').value;
  $('daysField').hidden = repeat !== 'weekly';
  $('intervalField').hidden = repeat !== 'customInterval';
}

async function saveEdit() {
  const title = $('fTitle').value.trim();
  if (!title) { toast('请填写标题'); return; }

  const repeat = $('fRepeat').value;
  const days = Array.from(document.querySelectorAll('.day-chip.on'))
    .map((c) => Number(c.dataset.day));

  const payload = {
    title,
    description: $('fDesc').value.trim(),
    due_date: $('fDue').value ? new Date($('fDue').value).toISOString() : null,
    repeat_type: repeat,
    repeat_days: days,
    interval_days: Number($('fInterval').value || 1),
    priority: Number($('fPriority').value),
    status: $('fStatus').value,
  };

  try {
    if (state.editingId) {
      const data = await api('/api/todos/' + state.editingId, { method: 'PUT', body: JSON.stringify(payload) });
      toast(data.calendar_warning ? '已保存（日历未同步：' + data.calendar_warning + '）' : '已保存');
    } else {
      const data = await api('/api/todos', { method: 'POST', body: JSON.stringify(payload) });
      toast(data.calendar_warning ? '已创建（日历未同步：' + data.calendar_warning + '）' : '已创建');
    }
    $('editDialog').close();
    await loadTodos();
  } catch (e) { toast(e.message); }
}

/* ---------- 导入 ---------- */
let pendingImport = null;

async function previewImport() {
  const file = $('fileInput').files[0];
  $('importError').textContent = '';
  $('previewArea').hidden = true;
  $('confirmImportBtn').disabled = true;
  pendingImport = null;
  if (!file) return;

  try {
    const buf = await file.arrayBuffer();
    const res = await fetch('/api/import?dryRun=1&name=' + encodeURIComponent(file.name), {
      method: 'POST', credentials: 'same-origin', body: buf,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '解析失败');

    pendingImport = { name: file.name, buf };
    const rows = data.rows || [];
    const tb = $('previewBody');
    tb.innerHTML = '';
    for (const r of rows.slice(0, 20)) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td></td><td></td><td></td><td></td>';
      tr.children[0].textContent = r.title || '';
      tr.children[1].textContent = r.due_date ? fmtDate(r.due_date) : '—';
      tr.children[2].textContent = REPEAT_LABEL[r.repeat_type] || '不重复';
      tr.children[3].textContent = PRIORITY_LABEL[r.priority] || '中';
      tb.appendChild(tr);
    }
    $('previewArea').hidden = false;
    $('confirmImportBtn').disabled = rows.length === 0;
    if (rows.length === 0) $('importError').textContent = '文件中没有可导入的数据行';
  } catch (e) {
    $('importError').textContent = e.message;
  }
}

async function confirmImport() {
  if (!pendingImport) return;
  try {
    const res = await fetch('/api/import?name=' + encodeURIComponent(pendingImport.name), {
      method: 'POST', credentials: 'same-origin', body: pendingImport.buf,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '导入失败');
    $('importDialog').close();
    toast('导入成功 ' + data.inserted + ' 条' + (data.failed.length ? '，失败 ' + data.failed.length + ' 条' : ''));
    await loadTodos();
  } catch (e) {
    $('importError').textContent = e.message;
  }
}

/* ---------- 事件绑定 ---------- */
$('loginBtn').onclick = tryLogin;
$('pwdInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryLogin(); });
$('addBtn').onclick = () => openEdit(null);
$('refreshBtn').onclick = () => loadTodos().catch((e) => toast(e.message));
$('exportCsvBtn').onclick = () => window.open('/api/export?format=csv');
$('exportJsonBtn').onclick = () => window.open('/api/export?format=json');
$('importBtn').onclick = () => {
  $('fileInput').value = '';
  $('previewArea').hidden = true;
  $('importError').textContent = '';
  $('confirmImportBtn').disabled = true;
  pendingImport = null;
  $('importDialog').showModal();
};
$('cancelEditBtn').onclick = () => $('editDialog').close();
$('saveEditBtn').onclick = saveEdit;
$('cancelImportBtn').onclick = () => $('importDialog').close();
$('confirmImportBtn').onclick = confirmImport;
$('fileInput').onchange = previewImport;
$('fRepeat').onchange = syncRepeatUI;
$('searchInput').addEventListener('input', (e) => { state.q = e.target.value; render(); });

document.querySelectorAll('#filterChips .chip').forEach((chip) => {
  chip.onclick = () => {
    document.querySelectorAll('#filterChips .chip').forEach((c) => c.classList.remove('active'));
    chip.classList.add('active');
    state.filter = chip.dataset.filter;
    render();
  };
});

/* 启动：已登录则直接进入列表 */
(async () => {
  try {
    await loadTodos();
    $('loginView').hidden = true;
    $('mainView').hidden = false;
  } catch (e) {
    showLogin();
  }
})();
</script>
</body>
</html>
